[project]
name = "sales-ai-forecasting-backend"
version = "0.1.0"
description = "FastAPI backend for the Sales AI Forecasting dashboard"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "joblib",
    "databricks-sql-connector",
    "pyarrow",
    "statsmodels",
    "prophet",
    "cmdstanpy",
    "python-dotenv",
    "tensorflow",
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "databricks-sdk",
    "python-multipart",
]

[tool.uv]
package = false
